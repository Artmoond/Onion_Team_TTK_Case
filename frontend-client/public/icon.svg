<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E30613" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.4" flood-color="#000" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle map grid pattern -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />
  
  <!-- Compass / Pin needle symbol -->
  <polygon points="256,70 286,220 226,220" fill="#ffffff" opacity="0.9" filter="url(#shadow)" />
  <polygon points="256,292 286,220 226,220" fill="#ffcccc" opacity="0.7" />
  
  <!-- Bold TTK text badge -->
  <rect x="96" y="300" width="320" height="110" rx="28" fill="#ffffff" filter="url(#shadow)" />
  <text x="256" y="378" text-anchor="middle" fill="#E30613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" letter-spacing="4">ТТК</text>
  
  <!-- Subtitle -->
  <text x="256" y="445" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" letter-spacing="6" opacity="0.9">КАРТА 2026</text>
</svg>
