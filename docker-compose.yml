# Docker Compose для всех сервисов хакатона ТТК

services:
  # Бэкенд API и A* алгоритм навигации (Участник №3)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ttk-backend
    ports:
      - "8000:8000"
    volumes:
      # :z — SELinux-метка для bind mount. Без неё на Fedora контейнер
      # получает permission denied на чтение/запись файлов проекта.
      - ./backend:/app:z
      - ./shared:/app/shared:z
      - ./data/uploads:/app/uploads:z
    environment:
      - PYTHONUNBUFFERED=1
      # Авторизация. Для боевого сервера обязательно задайте свой TTK_JWT_SECRET.
      - TTK_JWT_SECRET=${TTK_JWT_SECRET:-ttk-dev-secret-change-me-7f4c2a91b8e35d6c0a4f9e2d1b7c8a63}
      - TTK_AUTH_DB=/app/data/auth.db
      - TTK_ADMIN_INVITE_CODE=${TTK_ADMIN_INVITE_CODE:-TTK-ADMIN-2026}
      - TTK_ADMIN_EMAIL=${TTK_ADMIN_EMAIL:-admin@ttk.example.com}
      - TTK_ADMIN_PASSWORD=${TTK_ADMIN_PASSWORD:-Admin12345!}
      - TTK_USER_EMAIL=${TTK_USER_EMAIL:-user@ttk.example.com}
      - TTK_USER_PASSWORD=${TTK_USER_PASSWORD:-User12345!}
      - TTK_TRUST_PROXY=${TTK_TRUST_PROXY:-false}
      - TTK_CORS_ORIGINS=${TTK_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
    restart: unless-stopped

  # Мобильный веб-клиент посетителя (Участник №1)
  frontend-client:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    container_name: ttk-client
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-client:/app:z
      - /app/node_modules
      - ./shared:/app/shared:z
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_ADMIN_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped

  # Студия редактора для организатора (Участник №2)
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: ttk-admin
    ports:
      - "3001:3001"
    volumes:
      - ./frontend-admin:/app:z
      - /app/node_modules
      - ./shared:/app/shared:z
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_CLIENT_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

  # Воркер сшивки панорам и сжатия WebP (Участник №4)
  cv-worker:
    build:
      context: ./cv-worker
      dockerfile: Dockerfile
      # На Linux UID/GID должны совпадать с владельцем ./data/uploads.
      # При необходимости: CV_UID=$(id -u) CV_GID=$(id -g) docker compose up -d
      args:
        APP_UID: ${CV_UID:-1000}
        APP_GID: ${CV_GID:-1000}
    container_name: ttk-cv-worker
    # Явная команда: не зависим от CMD в старом образе. Без подкоманды
    # watch worker.py завершается с кодом 2.
    command: ["python", "worker.py", "watch"]
    volumes:
      - ./cv-worker:/app:z
      - ./data/uploads:/app/uploads:z
    restart: unless-stopped
