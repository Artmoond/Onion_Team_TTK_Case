events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Оптимизация передачи файлов
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Максимальный размер загрузки (для панорам и поэтажных планов)
    client_max_body_size 35M;

    # Gzip сжатие ответов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream сервисы внутри Docker сети
    upstream backend_service {
        server backend:8000;
        keepalive 32;
    }

    upstream client_service {
        server frontend-client:80;
        keepalive 32;
    }

    upstream admin_service {
        server frontend-admin:80;
        keepalive 32;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Проксирующие заголовки
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 1. API Бэкенда
        location /api/ {
            proxy_pass http://backend_service;
            proxy_read_timeout 180s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
        }

        # 2. Документация Swagger & OpenAPI
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://backend_service;
        }

        # 3. Раздача загруженных файлов и панорам
        location /uploads/ {
            proxy_pass http://backend_service;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # 4. Студия Организатора (CAD-редактор)
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_service/;
        }

        # 5. Мобильный клиент посетителя (по умолчанию)
        location / {
            proxy_pass http://client_service/;
        }

        # Страницы ошибок
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
